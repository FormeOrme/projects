<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SVG to PNG Converter</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="font-sans max-w-[800px] mx-auto p-5 my-[50px]">
        <h1>SVG to PNG Icon Converter</h1>

        <div class="mb-5 flex items-center gap-5">
            <div class="flex items-center gap-1">
                <label for="emojiInput" class="font-bold mr-1">Emoji:</label>
                <input type="text" id="emojiInput" value="🟩" maxlength="4" class="p-2 border border-gray-300 rounded text-sm w-20 text-xl" />
            </div>

            <div class="flex items-center gap-1">
                <label for="fontSizeInput" class="font-bold mr-1">Font Size:</label>
                <input type="number" id="fontSizeInput" value="100" min="8" max="128" class="p-2 border border-gray-300 rounded text-sm w-20" />
            </div>

            <div class="flex items-center gap-1">
                <label for="viewBoxZoomInput" class="font-bold mr-1">ViewBox Zoom:</label>
                <input
                    type="range"
                    id="viewBoxZoomInput"
                    value="0.89"
                    min="0.5"
                    max="1"
                    step="0.01"
                    class="w-[150px]"
                />
                <input
                    type="number"
                    id="viewBoxZoomNumber"
                    value="0.89"
                    min="0.5"
                    max="1"
                    step="0.01"
                    readonly
                    class="w-[60px] p-1 border border-gray-300 rounded text-sm"
                />
            </div>
        </div>

        <div class="mb-8">
            <h3>Generated SVG:</h3>
            <pre id="svgOutput" class="w-full bg-gray-100 p-4 border border-gray-300 rounded font-mono text-[12px] box-border overflow-x-auto whitespace-pre-wrap break-words"></pre>
        </div>

        <div class="mb-8">
            <h3>Icon link:</h3>
            <pre id="iconLinkOutput" class="w-full bg-gray-100 p-4 border border-gray-300 rounded font-mono text-[12px] box-border overflow-x-auto whitespace-pre-wrap break-words"></pre>
        </div>

        <div class="flex gap-5 my-5 items-start" id="previewContainer"></div>

        <button id="downloadAll" class="py-2.5 px-5 m-1 cursor-pointer bg-blue-500 hover:bg-blue-600 text-white border-none rounded text-sm">Download All Icons</button>

        <script type="module">
            /**
             * SVG to PNG Converter Module
             */

            const sizes = [16, 48, 64, 128];

            function initializePreview() {
                const container = document.getElementById("previewContainer");
                container.innerHTML = "";

                sizes.forEach((size) => {
                    const previewItem = document.createElement("div");
                    previewItem.className = "text-center";

                    const title = document.createElement("h3");
                    title.textContent = `${size}×${size}`;

                    const canvas = document.createElement("canvas");
                    canvas.id = `canvas${size}`;
                    canvas.width = size;
                    canvas.height = size;
                    canvas.className = "border border-gray-300 block my-2.5 mx-auto";

                    const button = document.createElement("button");
                    button.id = `download${size}`;
                    button.textContent = `Download ${size}×${size}`;
                    button.className = "py-2.5 px-5 m-1 cursor-pointer bg-green-500 hover:bg-green-600 text-white rounded text-sm";
                    button.addEventListener("click", () => downloadIcon(size));

                    previewItem.appendChild(title);
                    previewItem.appendChild(canvas);
                    previewItem.appendChild(button);
                    container.appendChild(previewItem);
                });
            }

            function calculateTextYPosition(canvasSize, fontSize, k = 0.35) {
                return canvasSize / 2 + k * fontSize;
            }

            function generateSvg(fontSize, emoji, viewBoxZoom) {
                const viewBoxSize = fontSize / viewBoxZoom;
                const offset = (fontSize - viewBoxSize) / 2;

                const decimalPlaces = 0;
                const fixedBoxSize = viewBoxSize.toFixed(decimalPlaces);
                const fixedOffset = offset.toFixed(decimalPlaces);

                return `<svg xmlns='http://www.w3.org/2000/svg' viewBox='${fixedOffset} ${fixedOffset} ${fixedBoxSize} ${fixedBoxSize}'>
    <text x='${fontSize / 2}' y='${calculateTextYPosition(
        fontSize,
        fontSize,
    )}' font-size='${fontSize}' text-anchor='middle'>${emoji}</text>
</svg>`;
            }

            function getSvgContent() {
                const emoji = document.getElementById("emojiInput").value || "🟩";
                const fontSize = parseInt(document.getElementById("fontSizeInput").value) || 32;
                const viewBoxZoom =
                    parseFloat(document.getElementById("viewBoxZoomInput").value) || 1;
                return generateSvg(fontSize, emoji, viewBoxZoom);
            }

            function updateSvgOutput(svgContent) {
                document.getElementById("svgOutput").textContent = svgContent;
            }

            function updateIconLinkOutput(svgContent) {
                const dataUrl = `data:image/svg+xml,${svgContent}`;
                const linkElement = `<link rel="icon" type="image/svg+xml" href="${dataUrl}">`;
                document.getElementById("iconLinkOutput").textContent = linkElement;
            }

            function drawIcon(size) {
                const canvas = document.getElementById(`canvas${size}`);
                const ctx = canvas.getContext("2d");

                const img = new Image();
                const svg = new Blob([getSvgContent()], { type: "image/svg+xml" });
                const url = URL.createObjectURL(svg);

                return new Promise((resolve) => {
                    img.onload = function () {
                        ctx.clearRect(0, 0, size, size);
                        ctx.drawImage(img, 0, 0, size, size);
                        URL.revokeObjectURL(url);
                        resolve();
                    };
                    img.src = url;
                });
            }

            function downloadIcon(size) {
                const canvas = document.getElementById(`canvas${size}`);
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `icon${size}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            }

            async function downloadAll() {
                for (const size of sizes) {
                    await new Promise((resolve) => setTimeout(resolve, 300));
                    downloadIcon(size);
                }
            }

            async function regenerateIcons() {
                for (const size of sizes) {
                    await drawIcon(size);
                }
            }

            // Auto-update icons when inputs change
            document.getElementById("emojiInput").addEventListener("input", () => {
                const svgContent = getSvgContent();
                updateSvgOutput(svgContent);
                updateIconLinkOutput(svgContent);
                regenerateIcons();
            });

            document.getElementById("fontSizeInput").addEventListener("input", () => {
                const svgContent = getSvgContent();
                updateSvgOutput(svgContent);
                updateIconLinkOutput(svgContent);
                regenerateIcons();
            });

            document.getElementById("viewBoxZoomInput").addEventListener("input", (e) => {
                document.getElementById("viewBoxZoomNumber").value = e.target.value;
                const svgContent = getSvgContent();
                updateSvgOutput(svgContent);
                updateIconLinkOutput(svgContent);
                regenerateIcons();
            });

            // Draw all icons on page load
            window.addEventListener("load", async () => {
                initializePreview();
                const svgContent = getSvgContent();
                updateSvgOutput(svgContent);
                updateIconLinkOutput(svgContent);
                for (const size of sizes) {
                    await drawIcon(size);
                }
            });

            // Set up download all button
            document.getElementById("downloadAll").addEventListener("click", downloadAll);
        </script>
    </body>
</html>
